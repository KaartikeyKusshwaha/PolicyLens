[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "policylens-toolkit"
version = "0.1.0"
description = "Governed PolicyLens evidence and draft tools for agents"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
policylens = "policylens_toolkit.cli:main"
policylens-mcp = "policylens_toolkit.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
