name: PolicyLens checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest
      - run: python -m ruff check backend toolkit/src evaluation run.py manage.py evaluate_agents.py verify_agent_evaluation.py deploy/export_backup.py deploy/pull_backup.py deploy/watchdog.py deploy/telegram_alerts.py deploy/setup_telegram.py deploy/deletion_state_backup.py deploy/checkpoint_backup.py deploy/recovery_set.py deploy/server_settings.py
  python-dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -r backend/requirements.txt pip-audit==2.10.1
      - run: python -m pip_audit --strict --local --progress-spinner off --format json --output python-dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-dependency-audit
          path: python-dependency-audit.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit
